<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SprintOAnalyzer – Download</title>
<style>
  :root { color-scheme: light dark; --fg:#1d1d1f; --muted:#6e6e73; --bg:#f5f5f7; --card:#fff; --accent:#0a66c2; --line:#d2d2d7; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f5f5f7; --muted:#a1a1a6; --bg:#111; --card:#1c1c1e; --accent:#4c9aff; --line:#38383a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:640px; margin:0 auto; padding:56px 20px; }
  h1 { font-size:2rem; margin:0 0 4px; }
  .version { color:var(--muted); margin:0 0 32px; }
  .card { display:flex; align-items:center; gap:16px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:14px; }
  .card .info { flex:1; min-width:0; }
  .card .os { font-weight:600; font-size:1.1rem; }
  .card .meta { color:var(--muted); font-size:.9rem; overflow-wrap:anywhere; }
  .btn { flex:none; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; padding:10px 18px; border-radius:10px; }
  .btn:hover { filter:brightness(1.1); }
  .hint { color:var(--muted); font-size:.9rem; margin-top:28px; }
  .hint p { margin:6px 0; }
  a.plain { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>SprintOAnalyzer</h1>
  <p class="version" id="version">Neueste Version wird geladen …</p>
  <div id="files"></div>
  <div class="hint">
    <p><strong>macOS:</strong> DMG öffnen, App in den Programme-Ordner ziehen. Beim ersten Start Rechtsklick → Öffnen.</p>
    <p><strong>Windows:</strong> setup.exe ausführen. Falls SmartScreen warnt: „Weitere Informationen“ → „Trotzdem ausführen“.</p>
    <p>Ältere Versionen: <a class="plain" href="https://github.com/fabian-hertner/SprintOAnalyzer-Dist/releases">alle Releases</a></p>
  </div>
</main>
<script>
const REPO = "fabian-hertner/SprintOAnalyzer-Dist";
const label = name =>
  /\.dmg$/i.test(name) ? ["macOS", "Apple Silicon (M1 und neuer)"] :
  /\.exe$/i.test(name) ? ["Windows", "Windows 10 / 11, 64 Bit"] : null;
const mb = n => (n / 1048576).toFixed(0) + " MB";

fetch(`https://api.github.com/repos/${REPO}/releases/latest`)
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(rel => {
    const date = new Date(rel.published_at).toLocaleDateString("de-CH");
    document.getElementById("version").textContent = `Version ${rel.tag_name.replace(/^v/, "")} · ${date}`;
    const box = document.getElementById("files");
    rel.assets.map(a => [a, label(a.name)]).filter(([, l]) => l)
      .sort(([, a], [, b]) => a[0].localeCompare(b[0]))
      .forEach(([a, [os, desc]]) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<div class="info"><div class="os"></div><div class="meta"></div></div><a class="btn">Herunterladen</a>`;
        card.querySelector(".os").textContent = os;
        card.querySelector(".meta").textContent = `${desc} · ${mb(a.size)}`;
        card.querySelector(".btn").href = a.browser_download_url;
        box.appendChild(card);
      });
  })
  .catch(() => {
    document.getElementById("version").innerHTML =
      'Liste konnte nicht geladen werden – <a class="plain" href="https://github.com/fabian-hertner/SprintOAnalyzer-Dist/releases/latest">direkt zum Download</a>.';
  });
</script>
</body>
</html>
